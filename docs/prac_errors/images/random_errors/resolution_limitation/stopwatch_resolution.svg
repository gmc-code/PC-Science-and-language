<text x="400.0" y="368.0" text-anchor="middle" font-size="13" fill="#1f5fbf" font-weight="bold" font-style="normal">every time from 1.15 s to 1.25 s is displayed as 1.2 s</text>
<text x="60.0" y="526.0" text-anchor="start" font-size="12.5" fill="#c62828" font-weight="normal" font-style="normal">Error: differences smaller than the resolution (0.1 s) are lost, so close times cannot be told apart.</text>
<text x="60.0" y="547.0" text-anchor="start" font-size="12.5" fill="#1b7f3b" font-weight="normal" font-style="normal">Fix: use a timer with finer resolution (0.01 s) or a light gate, and repeat the timing.</text>
