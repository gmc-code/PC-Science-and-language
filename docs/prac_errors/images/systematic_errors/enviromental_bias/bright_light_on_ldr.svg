<text x="642.0" y="128.0" text-anchor="start" font-size="12" fill="#c62828" font-weight="bold" font-style="normal">bright overhead</text>
<text x="642.0" y="142.0" text-anchor="start" font-size="12" fill="#c62828" font-weight="bold" font-style="normal">light</text>
<rect x="124.8" y="386.0" width="180.5" height="20" rx="10" fill="#fff" stroke="#1b7f3b" stroke-width="1.8"/>
<text x="215.0" y="400.5" text-anchor="middle" font-size="13" fill="#1b7f3b" font-weight="bold" font-style="normal">Reads 5.0 kΩ (intended)</text>
<rect x="498.4" y="386.0" width="173.3" height="20" rx="10" fill="#fff" stroke="#c62828" stroke-width="1.8"/>
<text x="585.0" y="400.5" text-anchor="middle" font-size="13" fill="#c62828" font-weight="bold" font-style="normal">Reads 1.8 kΩ (too low)</text>
<text x="60.0" y="526.0" text-anchor="start" font-size="12.5" fill="#c62828" font-weight="normal" font-style="normal">Error: stray bright light adds to the light reaching the LDR, so every resistance reading is too low.</text>
<text x="60.0" y="547.0" text-anchor="start" font-size="12.5" fill="#1b7f3b" font-weight="normal" font-style="normal">Fix: shield the LDR (for example with a dark tube) so only the intended light reaches it.</text>
