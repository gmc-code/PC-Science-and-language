<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" width="800" height="560" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Systematic error: high humidity affects mass readings</title>
<defs>
<marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1b7f3b"/></marker>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#c62828"/></marker>
<marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#666666"/></marker>
</defs>
<rect width="800" height="560" fill="#fff"/>
<text x="400" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#222222">Systematic error: high humidity affects mass readings</text>
<text x="400" y="58" text-anchor="middle" font-size="13.5" fill="#666666">A hygroscopic solid absorbs water vapour from humid air, so its measured mass is too high</text>
<rect x="281.2" y="90.0" width="237.7" height="20" rx="10" fill="#fff" stroke="#1f5fbf" stroke-width="1.8"/>
<text x="400.0" y="104.5" text-anchor="middle" font-size="13" fill="#1f5fbf" font-weight="bold" font-style="normal">Humidity: 85 % (standard: 50 %)</text>
<rect x="290" y="360" width="220" height="60" rx="8" fill="#ddd" stroke="#222" stroke-width="2.4"/>
<rect x="330" y="375" width="140" height="30" rx="3" fill="#222"/>
<text x="400.0" y="397.0" text-anchor="middle" font-size="18" fill="#7cfc00" font-weight="bold" font-style="normal">10.37 g</text>
<line x1="400.0" y1="343.0" x2="400.0" y2="360.0" stroke="#222222" stroke-width="3"/>
<rect x="335" y="335" width="130" height="8" fill="#999" stroke="#222" stroke-width="1.6"/>
<path d="M362 335 L362 318 Q400 308 438 318 L438 335 Z" fill="#fff" stroke="#222" stroke-width="2"/>
<polygon points="368,318 400,285 432,318" fill="#fff" stroke="#222" stroke-width="2"/>
<text x="400.0" y="306.0" text-anchor="middle" font-size="11" fill="#666666" font-weight="normal" font-style="normal">solid</text>
<circle cx="300" cy="200" r="6" fill="#7fb3ee" stroke="#1f5fbf" stroke-width="1.4"/>
<line x1="307.4" y1="206.7" x2="355.0" y2="249.5" stroke="#1f5fbf" stroke-width="1.8" marker-end="url(#ak)"/>
<circle cx="340" cy="150" r="6" fill="#7fb3ee" stroke="#1f5fbf" stroke-width="1.4"/>
<line x1="343.9" y1="159.2" x2="373.0" y2="227.0" stroke="#1f5fbf" stroke-width="1.8" marker-end="url(#ak)"/>
<circle cx="470" cy="160" r="6" fill="#7fb3ee" stroke="#1f5fbf" stroke-width="1.4"/>
<line x1="465.3" y1="168.8" x2="431.5" y2="231.5" stroke="#1f5fbf" stroke-width="1.8" marker-end="url(#ak)"/>
<circle cx="510" cy="220" r="6" fill="#7fb3ee" stroke="#1f5fbf" stroke-width="1.4"/>
<line x1="501.6" y1="225.4" x2="449.5" y2="258.5" stroke="#1f5fbf" stroke-width="1.8" marker-end="url(#ak)"/>
<circle cx="300" cy="290" r="6" fill="#7fb3ee" stroke="#1f5fbf" stroke-width="1.4"/>
<line x1="310.0" y1="290.0" x2="355.0" y2="290.0" stroke="#1f5fbf" stroke-width="1.8" marker-end="url(#ak)"/>
<circle cx="500" cy="300" r="6" fill="#7fb3ee" stroke="#1f5fbf" stroke-width="1.4"/>
<line x1="490.0" y1="299.0" x2="445.0" y2="294.5" stroke="#1f5fbf" stroke-width="1.8" marker-end="url(#ak)"/>
<text x="400.0" y="130.0" text-anchor="middle" font-size="12.5" fill="#1f5fbf" font-weight="normal" font-style="italic">water vapour absorbed</text>
<rect x="545.0" y="275.0" width="144.7" height="20" rx="10" fill="#fff" stroke="#1b7f3b" stroke-width="1.8"/>
<text x="617.4" y="289.5" text-anchor="middle" font-size="13" fill="#1b7f3b" font-weight="bold" font-style="normal">True mass: 10.00 g</text>
<rect x="545.0" y="315.0" width="209.1" height="20" rx="10" fill="#fff" stroke="#c62828" stroke-width="1.8"/>
<text x="649.5" y="329.5" text-anchor="middle" font-size="13" fill="#c62828" font-weight="bold" font-style="normal">Displays 10.37 g (too high)</text>
<text x="60.0" y="526.0" text-anchor="start" font-size="12.5" fill="#c62828" font-weight="normal" font-style="normal">Error: the solid takes in water vapour from the humid air, so every mass reading is too high.</text>
<text x="60.0" y="547.0" text-anchor="start" font-size="12.5" fill="#1b7f3b" font-weight="normal" font-style="normal">Fix: dry the sample, weigh it quickly with a lid on, and keep the humidity at the standard level.</text>
</svg>
