<text x="170.0" y="300.0" text-anchor="middle" font-size="12" fill="#666666" font-weight="normal" font-style="normal">(true 490 g)</text>
<rect x="600" y="302" width="60" height="18" fill="#d8b04a" stroke="#222" stroke-width="1.6"/>
<text x="630.0" y="315.0" text-anchor="middle" font-size="11.5" fill="#222222" font-weight="bold" font-style="normal">100 g</text>
