</defs>
<rect width="800" height="560" fill="#fff"/>
<text x="400" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#222222">Systematic error: masses lighter than their labels</text>
<text x="400" y="58" text-anchor="middle" font-size="13.5" fill="#666666">The masses labelled 100 g weigh only 98 g, so every mass found with them is wrong by the same 2 %</text>
