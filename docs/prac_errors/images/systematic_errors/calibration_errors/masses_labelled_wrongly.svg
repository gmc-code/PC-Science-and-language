<text x="630.0" y="261.0" text-anchor="middle" font-size="11.5" fill="#222222" font-weight="bold" font-style="normal">100 g</text>
<rect x="600" y="230" width="60" height="18" fill="#d8b04a" stroke="#222" stroke-width="1.6"/>
<text x="630.0" y="243.0" text-anchor="middle" font-size="11.5" fill="#222222" font-weight="bold" font-style="normal">100 g</text>
<text x="630.0" y="206.0" text-anchor="middle" font-size="13" fill="#222222" font-weight="bold" font-style="normal">5 masses labelled 100 g</text>
<text x="630.0" y="222.0" text-anchor="middle" font-size="12.5" fill="#c62828" font-weight="bold" font-style="normal">(each really 98 g)</text>
<text x="400.0" y="440.0" text-anchor="middle" font-size="12.5" fill="#666666" font-weight="normal" font-style="italic">The pans balance: the object really matches 5 × 98 g</text>
