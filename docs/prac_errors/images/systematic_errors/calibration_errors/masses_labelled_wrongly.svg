<line x1="170.0" y1="235.0" x2="120.0" y2="320.0" stroke="#222222" stroke-width="1.6"/>
<line x1="170.0" y1="235.0" x2="220.0" y2="320.0" stroke="#222222" stroke-width="1.6"/>
<path d="M110 320 L230 320 Q220 338 170 338 Q120 338 110 320Z" fill="#ddd" stroke="#222222" stroke-width="2"/>
<line x1="630.0" y1="235.0" x2="580.0" y2="320.0" stroke="#222222" stroke-width="1.6"/>
