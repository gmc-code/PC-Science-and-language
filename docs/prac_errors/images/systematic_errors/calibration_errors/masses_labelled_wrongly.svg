<text x="400.0" y="478.5" text-anchor="middle" font-size="13" fill="#c62828" font-weight="bold" font-style="normal">You record 5 × 100 = 500 g (too high)</text>
<rect x="252.6" y="490.0" width="294.9" height="20" rx="10" fill="#fff" stroke="#1b7f3b" stroke-width="1.8"/>
<text x="400.0" y="504.5" text-anchor="middle" font-size="13" fill="#1b7f3b" font-weight="bold" font-style="normal">True mass of the object: 5 × 98 = 490 g</text>
<text x="60.0" y="547.0" text-anchor="start" font-size="12.5" fill="#1b7f3b" font-weight="normal" font-style="normal">Fix: check the masses on a calibrated balance, or use a calibrated set.</text>
