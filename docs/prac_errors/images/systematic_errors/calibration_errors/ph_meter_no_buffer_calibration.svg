<text x="400.0" y="412.5" text-anchor="middle" font-size="13" fill="#c62828" font-weight="bold" font-style="normal">Same +0.30 offset in every solution</text>
<text x="400.0" y="444.0" text-anchor="middle" font-size="13" fill="#222222" font-weight="bold" font-style="normal">Calibration routine</text>
<rect x="48" y="454" width="165" height="46" rx="6" fill="#fff" stroke="#1b7f3b" stroke-width="2"/>
<text x="130.0" y="482.0" text-anchor="middle" font-size="12" fill="#1b7f3b" font-weight="bold" font-style="normal">1  Rinse the probe</text>
<rect x="228" y="454" width="165" height="46" rx="6" fill="#fff" stroke="#c62828" stroke-width="2" stroke-dasharray="6 4"/>
<text x="310.0" y="473.0" text-anchor="middle" font-size="12" fill="#c62828" font-weight="bold" font-style="normal">2  Calibrate with</text>
<text x="310.0" y="489.0" text-anchor="middle" font-size="12" fill="#c62828" font-weight="bold" font-style="normal">pH 7 buffer  (skipped)</text>
<rect x="408" y="454" width="165" height="46" rx="6" fill="#fff" stroke="#c62828" stroke-width="2" stroke-dasharray="6 4"/>
<text x="490.0" y="473.0" text-anchor="middle" font-size="12" fill="#c62828" font-weight="bold" font-style="normal">3  Calibrate with</text>
<text x="490.0" y="489.0" text-anchor="middle" font-size="12" fill="#c62828" font-weight="bold" font-style="normal">pH 4 or 10 buffer  (skipped)</text>
<rect x="588" y="454" width="165" height="46" rx="6" fill="#fff" stroke="#1b7f3b" stroke-width="2"/>
<text x="670.0" y="482.0" text-anchor="middle" font-size="12" fill="#1b7f3b" font-weight="bold" font-style="normal">4  Measure the sample</text>
<text x="60.0" y="547.0" text-anchor="start" font-size="12.5" fill="#1b7f3b" font-weight="normal" font-style="normal">Fix: calibrate with pH 7 and pH 4 or 10 buffers before each session, then check against a buffer.</text>
<text x="60.0" y="526.0" text-anchor="start" font-size="12.5" fill="#c62828" font-weight="normal" font-style="normal">Error: the meter was never calibrated against a buffer, so every reading is offset from the true pH.</text>
