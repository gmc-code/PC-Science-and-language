<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" width="800" height="560" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Systematic error: thermometer near the heat source</title>
<defs>
<marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1b7f3b"/></marker>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#c62828"/></marker>
<marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#666666"/></marker>
</defs>
<rect width="800" height="560" fill="#fff"/>
<text x="400" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#222222">Systematic error: thermometer near the heat source</text>
<text x="400" y="58" text-anchor="middle" font-size="13.5" fill="#666666">The liquid is hottest next to the heat, so a bulb placed there reads higher than the bulk of the liquid</text>
<defs><linearGradient id="g1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#cfe8f7"/><stop offset="1" stop-color="#f4a37a"/></linearGradient></defs>
<rect x="250" y="170" width="300" height="230" fill="url(#g1)"/>
<rect x="250" y="140" width="300" height="260" fill="none" stroke="#222" stroke-width="2.5"/>
<rect x="230" y="400" width="340" height="26" rx="4" fill="#555" stroke="#222" stroke-width="2"/>
<text x="400.0" y="447.0" text-anchor="middle" font-size="13" fill="#222222" font-weight="bold" font-style="normal">heat source (hotplate)</text>
<line x1="300.0" y1="398.0" x2="300.0" y2="372.0" stroke="#c62828" stroke-width="2.2" marker-end="url(#ar)"/>
<line x1="400.0" y1="398.0" x2="400.0" y2="372.0" stroke="#c62828" stroke-width="2.2" marker-end="url(#ar)"/>
<line x1="500.0" y1="398.0" x2="500.0" y2="372.0" stroke="#c62828" stroke-width="2.2" marker-end="url(#ar)"/>
<text x="390.0" y="204.0" text-anchor="middle" font-size="12" fill="#666666" font-weight="normal" font-style="italic">cooler bulk of liquid</text>
<rect x="306" y="108" width="8" height="278" fill="#fff" stroke="#222222" stroke-width="1.6"/>
<rect x="308" y="356" width="4" height="30" fill="#d33"/>
<circle cx="310" cy="386" r="9" fill="#d33" stroke="#222222" stroke-width="1.6"/>
<rect x="466" y="108" width="8" height="177" fill="#fff" stroke="#222222" stroke-width="1.6"/>
<rect x="468" y="255" width="4" height="30" fill="#d33"/>
<circle cx="470" cy="285" r="9" fill="#d33" stroke="#222222" stroke-width="1.6"/>
<text x="310.0" y="96.0" text-anchor="middle" font-size="12.5" fill="#c62828" font-weight="bold" font-style="normal">Wrong position</text>
<text x="470.0" y="96.0" text-anchor="middle" font-size="12.5" fill="#1b7f3b" font-weight="bold" font-style="normal">Correct position</text>
<line x1="300.0" y1="386.0" x2="244.0" y2="386.0" stroke="#c62828" stroke-width="1.4" stroke-dasharray="3 3"/>
<rect x="66.7" y="376.0" width="173.3" height="20" rx="10" fill="#fff" stroke="#c62828" stroke-width="1.8"/>
<text x="153.3" y="390.5" text-anchor="middle" font-size="13" fill="#c62828" font-weight="bold" font-style="normal">Reads 78 °C (too high)</text>
<line x1="480.0" y1="285.0" x2="556.0" y2="285.0" stroke="#1b7f3b" stroke-width="1.4" stroke-dasharray="3 3"/>
<rect x="560.0" y="275.0" width="180.5" height="20" rx="10" fill="#fff" stroke="#1b7f3b" stroke-width="1.8"/>
<text x="650.2" y="289.5" text-anchor="middle" font-size="13" fill="#1b7f3b" font-weight="bold" font-style="normal">Reads 62 °C (true bulk)</text>
<text x="60.0" y="526.0" text-anchor="start" font-size="12.5" fill="#c62828" font-weight="normal" font-style="normal">Error: the bulb sits in the hottest region instead of the bulk, so every reading is too high.</text>
<text x="60.0" y="547.0" text-anchor="start" font-size="12.5" fill="#1b7f3b" font-weight="normal" font-style="normal">Fix: stir the liquid and keep the bulb in the middle, away from the base, sides and heat source.</text>
</svg>
