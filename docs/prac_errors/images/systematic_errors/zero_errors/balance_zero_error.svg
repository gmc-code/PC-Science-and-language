<title>Systematic error: balance zero error</title>
<defs>
<marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1b7f3b"/></marker>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#c62828"/></marker>
<marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#666666"/></marker>
</defs>
<rect width="800" height="560" fill="#fff"/>
<text x="400" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#222222">Systematic error: balance zero error</text>
<text x="400" y="58" text-anchor="middle" font-size="13.5" fill="#666666">The balance reads 0.3 g with nothing on it, so every mass is 0.3 g too high</text>
<rect x="40" y="80" width="350" height="360" rx="8" fill="#fafafa" stroke="#bbb"/>
<rect x="410" y="80" width="350" height="360" rx="8" fill="#fafafa" stroke="#bbb"/>
<text x="215.0" y="102.0" text-anchor="middle" font-size="14" fill="#222222" font-weight="bold" font-style="normal">Empty pan</text>
<text x="585.0" y="102.0" text-anchor="middle" font-size="14" fill="#222222" font-weight="bold" font-style="normal">With a sample (true mass 5.0 g)</text>
<rect x="125" y="330" width="180" height="60" rx="8" fill="#ddd" stroke="#222222" stroke-width="2.4"/>
<rect x="165" y="342" width="100" height="32" rx="3" fill="#222"/>
<text x="215.0" y="366.0" text-anchor="middle" font-size="20" fill="#7cfc00" font-weight="bold" font-style="normal">0.3 g</text>
<line x1="215.0" y1="312.0" x2="215.0" y2="330.0" stroke="#222222" stroke-width="3"/>
<rect x="145" y="305" width="140" height="7" fill="#999" stroke="#222222" stroke-width="1.6"/>
<rect x="495" y="330" width="180" height="60" rx="8" fill="#ddd" stroke="#222222" stroke-width="2.4"/>
<rect x="535" y="342" width="100" height="32" rx="3" fill="#222"/>
<text x="585.0" y="366.0" text-anchor="middle" font-size="20" fill="#7cfc00" font-weight="bold" font-style="normal">5.3 g</text>
<line x1="585.0" y1="312.0" x2="585.0" y2="330.0" stroke="#222222" stroke-width="3"/>
<rect x="515" y="305" width="140" height="7" fill="#999" stroke="#222222" stroke-width="1.6"/>
<rect x="555" y="262" width="60" height="43" fill="#9ab" stroke="#222222" stroke-width="2"/>
<text x="585.0" y="289.0" text-anchor="middle" font-size="14" fill="#222222" font-weight="bold" font-style="normal">5.0 g</text>
<text x="215.0" y="250.0" text-anchor="middle" font-size="12.5" fill="#666666" font-weight="normal" font-style="italic">nothing on the pan</text>
<rect x="473.3" y="190.0" width="223.4" height="20" rx="10" fill="#fff" stroke="#1b7f3b" stroke-width="1.8"/>
<text x="585.0" y="204.5" text-anchor="middle" font-size="13" fill="#1b7f3b" font-weight="bold" font-style="normal">True mass = 5.3 − 0.3 = 5.0 g</text>
<rect x="103.3" y="408.0" width="223.4" height="20" rx="10" fill="#fff" stroke="#c62828" stroke-width="1.8"/>
<text x="215.0" y="422.5" text-anchor="middle" font-size="13" fill="#c62828" font-weight="bold" font-style="normal">Reads 0.3 g (should be 0.0 g)</text>
<rect x="476.9" y="408.0" width="216.2" height="20" rx="10" fill="#fff" stroke="#c62828" stroke-width="1.8"/>
<text x="585.0" y="422.5" text-anchor="middle" font-size="13" fill="#c62828" font-weight="bold" font-style="normal">Reads 5.3 g (0.3 g too high)</text>
<text x="60.0" y="526.0" text-anchor="start" font-size="12.5" fill="#c62828" font-weight="normal" font-style="normal">Error: the balance does not read zero when empty, so every mass reading is 0.3 g too high.</text>
<text x="60.0" y="547.0" text-anchor="start" font-size="12.5" fill="#1b7f3b" font-weight="normal" font-style="normal">Fix: press tare with the pan empty before each use, or subtract the 0.3 g zero error from every reading.</text>
