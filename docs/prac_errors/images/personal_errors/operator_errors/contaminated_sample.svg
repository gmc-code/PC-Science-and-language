<text x="60.0" y="526.0" text-anchor="start" font-size="12.5" fill="#c62828" font-weight="normal" font-style="normal">Error: equipment was not cleaned between trials, so leftover chemical contaminated the next sample.</text>
<text x="60.0" y="547.0" text-anchor="start" font-size="12.5" fill="#1b7f3b" font-weight="normal" font-style="normal">Fix: rinse and dry equipment between trials, or use fresh clean equipment for each trial.</text>
