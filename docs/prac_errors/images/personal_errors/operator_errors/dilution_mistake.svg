<title>Personal error: dilution mistake</title>
<defs>
<marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1b7f3b"/></marker>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#c62828"/></marker>
<marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#666666"/></marker>
</defs>
<rect width="800" height="560" fill="#fff"/>
<text x="400" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#222222">Personal error: dilution mistake</text>
<text x="400" y="58" text-anchor="middle" font-size="13.5" fill="#666666">The volumes measured out do not give the intended concentration</text>
<rect x="40" y="80" width="350" height="372" rx="8" fill="#fafafa" stroke="#bbb"/>
<rect x="410" y="80" width="350" height="372" rx="8" fill="#fafafa" stroke="#bbb"/>
<text x="215.0" y="102.0" text-anchor="middle" font-size="14" fill="#1b7f3b" font-weight="bold" font-style="normal">Planned (correct)</text>
<text x="585.0" y="102.0" text-anchor="middle" font-size="14" fill="#c62828" font-weight="bold" font-style="normal">What actually happened</text>
<text x="215.0" y="126.0" text-anchor="middle" font-size="11.5" fill="#666666" font-weight="normal" font-style="normal">Stock 1.00 mol/dm³ → target 0.10 mol/dm³ (100 mL)</text>
<rect x="70" y="170" width="28.0" height="40" fill="#1f4e9c"/>
<rect x="98.0" y="170" width="252.0" height="40" fill="#d6e4f7"/>
<rect x="70" y="170" width="280" height="40" fill="none" stroke="#222222" stroke-width="2"/>
<text x="70.0" y="232.0" text-anchor="start" font-size="12.5" fill="#222222" font-weight="bold" font-style="normal">stock 10 mL</text>
<text x="350.0" y="232.0" text-anchor="end" font-size="12.5" fill="#222222" font-weight="bold" font-style="normal">water 90 mL</text>
<rect x="165" y="276" width="100" height="76" fill="#bcd2f2"/>
<path d="M165 262 L165 352 L265 352 L265 262" fill="none" stroke="#222222" stroke-width="2.4"/>
<text x="215.0" y="310.0" text-anchor="middle" font-size="16" fill="#222222" font-weight="bold" font-style="normal">0.10</text>
<rect x="69.5" y="382.0" width="291.0" height="20" rx="10" fill="#fff" stroke="#1b7f3b" stroke-width="1.8"/>
<text x="215.0" y="396.5" text-anchor="middle" font-size="12.5" fill="#1b7f3b" font-weight="bold" font-style="normal">Concentration 0.10 mol/dm³ (as intended)</text>
<text x="585.0" y="126.0" text-anchor="middle" font-size="11.5" fill="#666666" font-weight="normal" font-style="normal">Stock 1.00 mol/dm³ → target 0.10 mol/dm³ (100 mL)</text>
<rect x="440" y="170" width="70.0" height="40" fill="#1f4e9c"/>
<rect x="510.0" y="170" width="210.0" height="40" fill="#d6e4f7"/>
<rect x="440" y="170" width="280" height="40" fill="none" stroke="#222222" stroke-width="2"/>
<text x="440.0" y="232.0" text-anchor="start" font-size="12.5" fill="#222222" font-weight="bold" font-style="normal">stock 25 mL</text>
<text x="720.0" y="232.0" text-anchor="end" font-size="12.5" fill="#222222" font-weight="bold" font-style="normal">water 75 mL</text>
<rect x="535" y="276" width="100" height="76" fill="#5c8fd6"/>
<path d="M535 262 L535 352 L635 352 L635 262" fill="none" stroke="#222222" stroke-width="2.4"/>
<text x="585.0" y="310.0" text-anchor="middle" font-size="16" fill="#222222" font-weight="bold" font-style="normal">0.25</text>
<rect x="449.8" y="382.0" width="270.4" height="20" rx="10" fill="#fff" stroke="#c62828" stroke-width="1.8"/>
<text x="585.0" y="396.5" text-anchor="middle" font-size="12.5" fill="#c62828" font-weight="bold" font-style="normal">Concentration 0.25 mol/dm³ (too high)</text>
<text x="60.0" y="526.0" text-anchor="start" font-size="12.5" fill="#c62828" font-weight="normal" font-style="normal">Error: the wrong volumes were used in the dilution, so the solution was more concentrated than intended.</text>
<text x="60.0" y="547.0" text-anchor="start" font-size="12.5" fill="#1b7f3b" font-weight="normal" font-style="normal">Fix: calculate the volumes first (C₁V₁ = C₂V₂), then check the calculation before measuring.</text>
