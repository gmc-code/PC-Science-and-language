<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" width="800" height="560" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Personal error: result recorded in the wrong row</title>
<defs>
<marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1b7f3b"/></marker>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#c62828"/></marker>
<marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#666666"/></marker>
</defs>
<rect width="800" height="560" fill="#fff"/>
<text x="400" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#222222">Personal error: result recorded in the wrong row</text>
<text x="400" y="58" text-anchor="middle" font-size="13.5" fill="#666666">Results from different trials are swapped, so the trend in the data is wrong</text>
<rect x="60" y="120" width="250" height="190" fill="#fff7c2" stroke="#222" stroke-width="2"/>
<text x="185.0" y="148.0" text-anchor="middle" font-size="14" fill="#222222" font-weight="bold" font-style="normal">Bench notes</text>
<rect x="480" y="120" width="260" height="190" fill="#fff" stroke="#222" stroke-width="2"/>
<text x="540.0" y="148.0" text-anchor="middle" font-size="12" fill="#222222" font-weight="bold" font-style="normal">Conc. (mol/dm³)</text>
<text x="685.0" y="148.0" text-anchor="middle" font-size="13" fill="#222222" font-weight="bold" font-style="normal">Rate</text>
<line x1="480.0" y1="160.0" x2="740.0" y2="160.0" stroke="#222222" stroke-width="1.6"/>
<line x1="610.0" y1="120.0" x2="610.0" y2="310.0" stroke="#222222" stroke-width="1.6"/>
<text x="75.0" y="195.0" text-anchor="start" font-size="14" fill="#222222" font-weight="normal" font-style="normal">Trial A:  0.10  →  4.2</text>
<text x="545.0" y="195.0" text-anchor="middle" font-size="15" fill="#222222" font-weight="normal" font-style="normal">0.10</text>
<text x="675.0" y="195.0" text-anchor="middle" font-size="16" fill="#c62828" font-weight="bold" font-style="normal">8.1</text>
<text x="75.0" y="235.0" text-anchor="start" font-size="14" fill="#222222" font-weight="normal" font-style="normal">Trial B:  0.20  →  8.1</text>
<text x="545.0" y="235.0" text-anchor="middle" font-size="15" fill="#222222" font-weight="normal" font-style="normal">0.20</text>
<text x="675.0" y="235.0" text-anchor="middle" font-size="16" fill="#c62828" font-weight="bold" font-style="normal">4.2</text>
<text x="75.0" y="275.0" text-anchor="start" font-size="14" fill="#222222" font-weight="normal" font-style="normal">Trial C:  0.30  →  12.3</text>
<text x="545.0" y="275.0" text-anchor="middle" font-size="15" fill="#222222" font-weight="normal" font-style="normal">0.30</text>
<text x="675.0" y="275.0" text-anchor="middle" font-size="16" fill="#1b7f3b" font-weight="bold" font-style="normal">12.3</text>
<line x1="305.0" y1="190.0" x2="472.0" y2="230.0" stroke="#c62828" stroke-width="2.4" marker-end="url(#ar)"/>
<line x1="305.0" y1="230.0" x2="472.0" y2="190.0" stroke="#c62828" stroke-width="2.4" marker-end="url(#ar)"/>
<line x1="305.0" y1="270.0" x2="472.0" y2="270.0" stroke="#1b7f3b" stroke-width="2.4" marker-end="url(#ag)"/>
<rect x="234.7" y="362.0" width="330.6" height="20" rx="10" fill="#fff" stroke="#c62828" stroke-width="1.8"/>
<text x="400.0" y="376.5" text-anchor="middle" font-size="13" fill="#c62828" font-weight="bold" font-style="normal">Trials A and B recorded in each other’s rows</text>
<rect x="170.3" y="392.0" width="459.3" height="20" rx="10" fill="#fff" stroke="#c62828" stroke-width="1.8"/>
<text x="400.0" y="406.5" text-anchor="middle" font-size="13" fill="#c62828" font-weight="bold" font-style="normal">The table says rate falls then rises: the true trend is hidden</text>
<text x="60.0" y="526.0" text-anchor="start" font-size="12.5" fill="#c62828" font-weight="normal" font-style="normal">Error: results from different trials were put in the wrong rows, so the trend in the data is wrong.</text>
<text x="60.0" y="547.0" text-anchor="start" font-size="12.5" fill="#1b7f3b" font-weight="normal" font-style="normal">Fix: label every result with its trial and conditions at the moment it is recorded.</text>
</svg>
