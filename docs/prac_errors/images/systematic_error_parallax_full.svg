 <title>Parallax error</title>
 <desc>Three eyes viewing a raised pointer against a ruler. Only the eye directly above reads the correct mark; the two viewing at an angle read too high or too low. Source: observational. Explanation: scale consistently viewed from an incorrect angle. Fix: read at eye level; use a mirror scale to confirm alignment.</desc>
